name: CI

# 照原仓库 Python 工作区的 CI 写法迁过来；去掉了只在自托管机器上才需要的步骤，
# 也去掉了只和服务层有关的检查。核心的单元测试不需要数据库。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一个 PR 连续推送只保留最新一次运行；main 上的推送按提交分组，互不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"

jobs:
  # ============================================
  # 代码质量
  # ============================================
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Ruff check all packages
        run: uvx ruff check packages/

  # ============================================
  # 边界测试：核心不能导入宿主侧的包，核心可以独立运行
  # ============================================
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      # 排除的两个用例要导入服务层的包 neuroagent_app，本仓库没有这个包（服务层没有迁入）。
      - name: Boundary tests
        run: >-
          uv run pytest tests/test_harness_boundary.py -v
          --deselect tests/test_harness_boundary.py::TestHarnessBoundary::test_app_can_import_harness
          --deselect tests/test_harness_boundary.py::TestHarnessBoundary::test_harness_direct_import_app_fails

  # ============================================
  # 静态扫描：核心禁止导入宿主侧的包
  # 原仓库的服务层、媒体适配层，加上它们改名后的对应名（暂定）
  # ============================================
  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan core for forbidden host-package imports
        run: |
          set -euo pipefail
          # 只匹配真正的 import 语句（行首允许缩进），避免注释、字符串里的写法误报
          matches=$(grep -rnE '^\s*(from|import)\s+(neuroagent_app|neuroagent_media|sanyuan_agent_app|sanyuan_agent_media)\b' packages/core/ --include='*.py' --exclude-dir=tests || true)
          if [ -n "$matches" ]; then
            echo "ERROR: packages/core/ contains forbidden imports of host-side packages:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no forbidden host-side imports found in packages/core/"

  # ============================================
  # 单元测试：核心自带的测试 + 工作区级测试
  # ============================================
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - name: Core unit tests
        run: uv run pytest packages/core/tests -v
      # 两组测试里有同名的测试文件，分两次跑。
      # 排除清单（迁移前的基线上就不过，迁移不修）：
      # - test_app_can_import_harness、test_harness_direct_import_app_fails：要导入服务层的包
      #   neuroagent_app，本仓库没有；
      # - tests/memory/longterm/test_longterm.py：第一个导入 sanyuan_agent.memory.longterm.tools
      #   时会循环导入，收集就报错。原仓库同样如此，原 CI 不跑工作区级的这组测试。
      - name: Workspace tests
        run: >-
          uv run pytest tests -v
          --deselect tests/test_harness_boundary.py::TestHarnessBoundary::test_app_can_import_harness
          --deselect tests/test_harness_boundary.py::TestHarnessBoundary::test_harness_direct_import_app_fails
          --ignore tests/memory/longterm/test_longterm.py

  # ============================================
  # 独立安装：核心只靠自己的依赖就能装上、跑起来
  # ============================================
  standalone-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install core in isolated venv (no host deps)
        # 核心按本地路径装，不按名字从包索引装
        run: |
          uv venv "$RUNNER_TEMP/core-only"
          uv pip install --python "$RUNNER_TEMP/core-only/bin/python" ./packages/core
          "$RUNNER_TEMP/core-only/bin/sanyuan-agent" --version
          "$RUNNER_TEMP/core-only/bin/python" -c 'from sanyuan_agent.memory import MemoryContext, MemoryLevel, render_memory_markdown; assert MemoryContext().project_id is None; assert MemoryLevel.PERSONAL == "personal"; assert callable(render_memory_markdown)'

  # ============================================
  # 旧名残留检查：剩下的旧名都要登记在 tools/migration/rename/exceptions.tsv
  # ============================================
  residue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for unregistered old names
        run: python3 tools/migration/rename/check_residue.py
      - name: Self-test (an unregistered old name must fail the check)
        run: |
          set -u
          # 拼出来写，免得这个文件本身出现旧名
          printf '%s\n' "# NEURO""AGENT" >> packages/core/sanyuan_agent/__init__.py
          if python3 tools/migration/rename/check_residue.py; then
            echo "ERROR: the residue check did not catch the injected old name"
            exit 1
          fi
          git checkout -- packages/core/sanyuan_agent/__init__.py
          echo "OK: the residue check catches an unregistered old name"
