[project]
name = "sanyuan-agent-workspace"
version = "0.1.0"
description = "SanYuanAgent Python monorepo (workspace root)"
requires-python = ">=3.12"

# 这是 uv workspace 的根配置，实际依赖在 packages/core/ 下
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
]

[tool.uv.sources]
sanyuan-agent = { workspace = true }

# ============================================
# 开发工具配置
# ============================================

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "packages/core/sanyuan_agent/skills/builtin/**/*.md",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — rely on formatter
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = [
    "^tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 把仓库根放进 sys.path（沿用原工作区的设置）。
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试（需要 Docker / PG / Redis）",
    "slow: 慢速测试",
    "boundary: Harness/App 边界与独立性测试（必过）",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "scikit-learn>=1.8.0",
]
