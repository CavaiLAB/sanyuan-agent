# SanYuanAgent Prompt Injection Rules v1
# Each rule: name, pattern (regex), severity (low|medium|high|critical),
# base confidence (0.0-1.0), tags for categorisation.
#
# Phase 1 = observation only (no rejection).

rules:
  # ---- English: instruction override -----------------------------------
  - name: ignore_previous_instructions
    pattern: "ignore\\s+(?:all\\s+)?previous\\s+instructions"
    severity: high
    confidence: 0.92
    tags: [english, instruction_override]

  - name: ignore_all_instructions
    pattern: "ignore\\s+all\\s+(?:your\\s+)?instructions"
    severity: high
    confidence: 0.93
    tags: [english, instruction_override]

  - name: forget_all_instructions
    pattern: "forget\\s+(?:all\\s+)?(?:your\\s+)?instructions"
    severity: high
    confidence: 0.90
    tags: [english, instruction_override]

  - name: disregard_instructions
    pattern: "disregard\\s+(?:all\\s+)?(?:your\\s+)?instructions"
    severity: high
    confidence: 0.90
    tags: [english, instruction_override]

  - name: override_instructions
    pattern: "override\\s+(?:your\\s+)?instructions"
    severity: high
    confidence: 0.88
    tags: [english, instruction_override]

  - name: new_instructions_replacement
    pattern: "(?:here(?:\\s+are)?|these\\s+are)\\s+(?:the\\s+)?new\\s+instructions"
    severity: medium
    confidence: 0.75
    tags: [english, instruction_override]

  - name: ignore_the_above
    pattern: "ignore\\s+(?:everything\\s+)?(?:the\\s+)?above"
    severity: high
    confidence: 0.88
    tags: [english, instruction_override]

  # ---- English: role manipulation --------------------------------------
  - name: you_are_now
    pattern: "you\\s+are\\s+now\\s+"
    severity: medium
    confidence: 0.78
    tags: [english, role_manipulation]

  - name: pretend_to_be
    pattern: "pretend\\s+(?:to\\s+be|that\\s+you\\s+are)"
    severity: medium
    confidence: 0.82
    tags: [english, role_manipulation]

  - name: act_as_if
    pattern: "act\\s+as\\s+if\\s+you"
    severity: medium
    confidence: 0.76
    tags: [english, role_manipulation]

  - name: you_are_no_longer
    pattern: "you\\s+are\\s+no\\s+longer"
    severity: medium
    confidence: 0.80
    tags: [english, role_manipulation]

  - name: pretend_role
    pattern: "pretend\\s+to\\s+be\\s+a"
    severity: medium
    confidence: 0.80
    tags: [english, role_manipulation]

  # ---- English: system prompt leaking / jailbreak ----------------------
  - name: system_prefix_tag
    pattern: "^\\s*SYSTEM\\s*:"
    severity: medium
    confidence: 0.72
    tags: [english, system_tag_injection]

  - name: markdown_system_header
    pattern: "^\\s*#{1,3}\\s+System"
    severity: medium
    confidence: 0.70
    tags: [english, system_tag_injection]

  - name: inst_tag
    pattern: "\\[INST\\]"
    severity: high
    confidence: 0.85
    tags: [english, system_tag_injection]

  - name: close_system_tag
    pattern: "</system>"
    severity: high
    confidence: 0.88
    tags: [english, system_tag_injection]

  - name: close_user_input_tag
    pattern: "</user_input>"
    severity: high
    confidence: 0.90
    tags: [english, prompt_tag_injection]

  - name: role_equals_system
    pattern: "role\\s*=\\s*[\"']?system[\"']?"
    severity: high
    confidence: 0.92
    tags: [english, system_tag_injection]

  - name: dan_mode
    pattern: "DAN\\s+mode"
    severity: high
    confidence: 0.93
    tags: [english, jailbreak]

  - name: do_anything_now
    pattern: "do\\s+anything\\s+now"
    severity: high
    confidence: 0.88
    tags: [english, jailbreak]

  - name: jailbreak_keyword
    pattern: "\\bjailbreak\\b"
    severity: high
    confidence: 0.85
    tags: [english, jailbreak]

  - name: bypass_safety
    pattern: "bypass\\s+(?:your\\s+)?safety"
    severity: high
    confidence: 0.90
    tags: [english, jailbreak]

  - name: sudo_mode
    pattern: "sudo\\s+mode"
    severity: medium
    confidence: 0.75
    tags: [english, jailbreak]

  - name: developer_mode
    pattern: "developer\\s+mode"
    severity: medium
    confidence: 0.72
    tags: [english, jailbreak]

  - name: debug_mode_toggle
    pattern: "debug\\s+mode\\s*(?:enabled|on|activate)"
    severity: low
    confidence: 0.60
    tags: [english, jailbreak]

  # ---- English: extraction / leakage -----------------------------------
  - name: reveal_system_prompt
    pattern: "(?:reveal|show|display|print|output)\\s+(?:your\\s+)?(?:system\\s+)?prompt"
    severity: medium
    confidence: 0.70
    tags: [english, extraction]

  - name: what_are_your_instructions
    pattern: "what\\s+(?:are|were)\\s+(?:your\\s+)?(?:original\\s+)?instructions"
    severity: low
    confidence: 0.55
    tags: [english, extraction]

  - name: repeat_previous
    pattern: "repeat\\s+(?:the\\s+)?(?:previous|above)\\s+(?:text|words|prompt)"
    severity: low
    confidence: 0.50
    tags: [english, extraction]

  # ---- Chinese: instruction override -----------------------------------
  - name: cn_ignore_above
    pattern: "请?忽略上述"
    severity: high
    confidence: 0.92
    tags: [chinese, instruction_override]

  - name: cn_ignore_previous
    pattern: "忽略之前的"
    severity: high
    confidence: 0.90
    tags: [chinese, instruction_override]

  - name: cn_ignore_instructions
    pattern: "忽略(?:所有)?指令"
    severity: high
    confidence: 0.90
    tags: [chinese, instruction_override]

  - name: cn_forget_all
    pattern: "忘记所有"
    severity: high
    confidence: 0.90
    tags: [chinese, instruction_override]

  - name: cn_do_not_follow
    pattern: "不要遵守"
    severity: high
    confidence: 0.88
    tags: [chinese, instruction_override]

  # ---- Chinese: role manipulation --------------------------------------
  - name: cn_you_are_now
    pattern: "你现在是"
    severity: medium
    confidence: 0.80
    tags: [chinese, role_manipulation]

  - name: cn_pretend_role
    pattern: "扮演"
    severity: medium
    confidence: 0.78
    tags: [chinese, role_manipulation]

  - name: cn_new_identity
    pattern: "新身份"
    severity: medium
    confidence: 0.75
    tags: [chinese, role_manipulation]

  - name: cn_from_now_on
    pattern: "从现在开始(?:你(?:是|将|要))?"
    severity: medium
    confidence: 0.72
    tags: [chinese, role_manipulation]

  # ---- Fuzzy: base64 / encoded prompts ---------------------------------
  - name: base64_encoded_prompt
    pattern: "(?:aWdub3Jl|Zm9yZ2V0|c3lzdGVt|cHJvbXB0|aW5zdHJ1Y3Rpb25z)"
    severity: medium
    confidence: 0.65
    tags: [english, encoding, obfuscation]

  - name: hex_encoded_system
    pattern: "(?:73\\s*79\\s*73\\s*74\\s*65\\s*6d|73797374656d)"
    severity: low
    confidence: 0.50
    tags: [english, encoding, obfuscation]
