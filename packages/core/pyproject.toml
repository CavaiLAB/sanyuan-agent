[project]
name = "neuroagent"
version = "0.1.0"
description = "NeuroAgent Harness — Agent 引擎核心（LangGraph + Sandbox + Skills + Memory + LLM Provider）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "NeuroAgent Contributors" },
]
keywords = ["agent", "llm", "langgraph", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
]

dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "litellm>=1.84.0,<1.85.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "aio-pika>=9.4.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation>=0.46b0",
    "cryptography>=43.0.0",   # Skill 签名验证
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "trafilatura>=1.12.0",
    "ddgs>=9.8.0",
    "playwright>=1.44.0",
    "respx>=0.23.1",
    "jsonschema>=4.23.0",
    "types-jsonschema>=4.26.0.20260408",
    # memory/vector.py 顶层 import——是硬运行时依赖。此前靠 litellm/langchain 传递
    # 带入,上游新版本掉链后 spark 镜像(uv pip install 现场解析,不走 lock)缺 numpy
    # 直接 CrashLoop;显式声明防再犯。
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.22.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
desktop-package = [
    "pyinstaller==6.21.0",
]

[project.scripts]
neuroagent = "neuroagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuroagent"]
